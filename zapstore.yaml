name: ants
summary: Nostr search for notes and profiles, native on Android
description: |
  ants is an opinionated Nostr search interface for Android with its own query language. Search notes and profiles without an account.

  Combine text with filters for authors, dates, hashtags, and event kinds. Use AND, OR, and nested groups to express queries like `(GM OR 🫂) by:dergigi since:2w`.

  The query language uses an ANTLR parser and shares its grammar with ants on the web.
